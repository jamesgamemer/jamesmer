<!-- SCRIPTS -->

<script src="js/guide-renderer.js"></script>
<script src="js/i18n.js"></script>
<script src="js/navbar.js?v=20260308"></script>


<script>

/* ================================
   I18N
================================ */

if (typeof I18n !== 'undefined') {

I18n.init();
I18n.applyTranslations();

}


/* ================================
   GET SLUG
================================ */

var params = new URLSearchParams(window.location.search);
var slug = params.get('slug');


/* ================================
   LOAD GUIDE
================================ */

async function loadGuide(){

var header = document.getElementById('guideHeader');
var content = document.getElementById('guideContent');

if(!header || !content) return;


/* NO SLUG */

if(!slug){

header.innerHTML =
'<h1 class="guide-detail-title">Guide not found</h1>';

content.innerHTML =
'<p style="color:var(--muted);">No guide slug provided.</p>';

return;

}


/* FETCH GUIDE */

var guide = await GuideAPI.fetchGuideBySlug(slug);

if(!guide){

header.innerHTML =
'<h1 class="guide-detail-title">Guide not found</h1>';

content.innerHTML =
'<p style="color:var(--muted);">Guide does not exist.</p>';

return;

}


/* PAGE TITLE */

document.title = guide.title + ' - 7DS Origin';


/* ================================
   RENDER HEADER
================================ */

var html = "";

if(guide.cover_image){

html +=
'<img src="'+guide.cover_image+'" class="guide-detail-cover" onerror="this.style.display=\'none\'">';

}

html += '<div class="guide-detail-meta">';

html +=
'<span class="guide-detail-category">'+
(guide.category || 'general')+
'</span>';

html +=
'<span class="guide-detail-date">Updated: '+
new Date(guide.updated_at).toLocaleDateString()+
'</span>';

html += '</div>';

html +=
'<h1 class="guide-detail-title">'+
guide.title+
'</h1>';

if(guide.description){

html +=
'<p class="guide-detail-desc">'+
guide.description+
'</p>';

}

header.innerHTML = html;


/* ================================
   ADMIN CONTROLS
================================ */

var isAdmin = false;

try{

isAdmin = await Auth.isLoggedIn();

}catch(e){}


if(isAdmin){

document.getElementById('guideAdminActions').style.display = "block";

document.getElementById('editGuideBtn').href =
'guide-editor.html?id=' + guide.id;

document.getElementById('deleteGuideBtn').onclick =
async function(){

if(!confirm("Delete this guide?")) return;

await GuideAPI.deleteGuide(guide.id);

window.location.href = "guides.html";

}

}


/* ================================
   LOAD BLOCKS
================================ */

var blocks = await GuideAPI.fetchBlocks(guide.id);

if(!blocks || blocks.length === 0){

content.innerHTML =
'<p style="color:var(--muted);text-align:center;padding:40px;">This guide has no content yet.</p>';

return;

}


/* ================================
   RENDER BLOCKS
================================ */

content.innerHTML =
GuideRenderer.renderBlocks(blocks);

}


/* ================================
   START
================================ */

document.addEventListener("DOMContentLoaded", loadGuide);

</script>


</body>
